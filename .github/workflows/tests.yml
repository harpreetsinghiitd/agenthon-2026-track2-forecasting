name: tests

on:
  push:
  pull_request:

jobs:
  my-agent-2-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: my-agent-2/requirements.txt
      - name: Install dependencies
        run: pip install -r my-agent-2/requirements.txt
      - name: Run unit tests
        working-directory: my-agent-2
        run: python -m pytest -q

  my-agent-3-compile:
    # my_agent_3 (the final submission) has no unit-test suite; this at least
    # guarantees every module still parses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q my_agent_3
